<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#c96442">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="想法速记">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>想法速记</title>
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --text:#1d1b19; --muted:#8a8279;
  --line:#e5e0d9; --accent:#c96442; --accent-weak:#f7e8e2;
  --ok:#2f7d55; --warn:#b06b16; --err:#b3372c;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14120f; --card:#1e1b18; --text:#ece7e1; --muted:#9a9086;
    --line:#302b26; --accent:#e07a54; --accent-weak:#3a2620;
    --ok:#5fbf8c; --warn:#e0a44a; --err:#e07a70;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
}
header{
  display:flex;align-items:center;gap:8px;
  padding:14px 16px 10px;
}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px}
header .spacer{flex:1}
.icon-btn{
  border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;padding:7px 12px;font-size:13px;cursor:pointer;
}
.icon-btn:active{transform:scale(.96)}
main{flex:1;display:flex;flex-direction:column;padding:0 16px 12px;min-height:0}
textarea{
  flex:1;width:100%;min-height:120px;resize:none;
  background:var(--card);color:var(--text);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;font-size:17px;line-height:1.6;
  font-family:inherit;outline:none;
}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:10px;padding-top:12px}
#btnVoice{
  width:52px;height:52px;flex:0 0 auto;border-radius:50%;
  border:1px solid var(--line);background:var(--card);font-size:20px;
  cursor:pointer;
}
#btnVoice.rec{background:var(--accent-weak);border-color:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
#status{flex:1;font-size:12px;color:var(--muted);line-height:1.4;min-width:0}
#status.ok{color:var(--ok)}
#status.warn{color:var(--warn)}
#status.err{color:var(--err)}
#btnSave{
  flex:0 0 auto;min-width:104px;height:52px;border:0;border-radius:14px;
  background:var(--accent);color:#fff;font-size:17px;font-weight:600;
  cursor:pointer;
}
#btnSave:active{transform:scale(.97)}
#btnSave:disabled{opacity:.5}

/* 底部抽屉 */
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:flex;align-items:flex-end;z-index:50;
}
.sheet[hidden]{display:none}
.sheet-inner{
  background:var(--card);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
}
.sheet-inner h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center}
.sheet-inner h2 .spacer{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=password]{
  width:100%;padding:12px 13px;font-size:15px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;
  font-family:inherit;
}
input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
.btn{
  width:100%;padding:14px;border-radius:13px;border:0;font-size:16px;
  background:var(--accent);color:#fff;font-weight:600;margin-top:16px;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);margin-top:8px}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--line)}
.item{
  padding:12px 0;border-bottom:1px solid var(--line);
}
.item .t{font-size:12px;color:var(--muted);margin-bottom:4px}
.item .c{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.item .c .tag{
  display:inline-block;background:var(--accent-weak);color:var(--accent);
  border-radius:6px;padding:0 5px;font-size:13px;margin:0 2px;
}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 0}
.badge{
  display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;
  background:var(--accent-weak);color:var(--accent);margin-left:6px;
}

/* ---------- 顶部切换 ---------- */
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tab{
  flex:1;padding:9px 0;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:14px;cursor:pointer;
  font-family:inherit;
}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* ---------- 对话 ---------- */
#viewChat{padding-bottom:0}
.chatlog{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  padding:4px 0 12px;min-height:0;
}
.msg{
  max-width:88%;padding:11px 14px;border-radius:15px;font-size:15.5px;
  line-height:1.65;white-space:pre-wrap;word-break:break-word;
}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;padding:3px;max-width:100%}
.msg .acts{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
.msg .acts button{
  font-size:12px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.6);color:var(--muted);font-family:inherit;cursor:pointer;
}
.msg.ai .acts button{background:transparent}
.chatbar{display:flex;gap:8px;padding:8px 0 12px;align-items:flex-end}
#chatInput{
  flex:1;min-height:46px;max-height:120px;resize:none;
  background:var(--card);color:var(--text);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45;
  font-family:inherit;outline:none;
}
#chatInput:focus{border-color:var(--accent)}
#btnSend{
  flex:0 0 auto;height:46px;padding:0 18px;border:0;border-radius:13px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  font-family:inherit;cursor:pointer;
}
#btnSend:disabled{opacity:.5}
.cursor{display:inline-block;width:7px;height:15px;background:var(--accent);
  animation:blink 1s step-end infinite;vertical-align:-2px;border-radius:2px}
@keyframes blink{50%{opacity:0}}

/* ---------- 语音 ---------- */
#viewVoice{padding-bottom:0}
.voice-list{flex:1;overflow-y:auto;padding:4px 0 12px;min-height:0}
.voice-item{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;
}
.voice-item .vh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.voice-item .vt{font-size:15.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.voice-item .acts{margin-top:9px;display:flex;gap:8px}
.voice-item .acts button{
  font-size:12px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-family:inherit;cursor:pointer;
}
.voice-item.pending{opacity:.8;border-style:dashed}
.voice-bar{display:flex;gap:10px;padding:8px 0 12px;align-items:center}
.rec-btn{
  flex:1;height:52px;border-radius:14px;border:0;background:var(--accent);color:#fff;
  font-size:17px;font-weight:600;font-family:inherit;display:flex;align-items:center;
  justify-content:center;gap:9px;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.rec-btn:active{transform:scale(.99)}
.rec-btn.recording{background:var(--err);animation:pulse 1.4s infinite}
.rec-btn.minor{
  flex:0 0 auto;padding:0 14px;background:var(--card);color:var(--text);
  border:1px solid var(--line);font-size:14px;font-weight:500;
}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.9}
</style>
</head>
<body>

<header>
  <h1>想法速记</h1>
  <span class="spacer"></span>
  <button class="icon-btn" id="btnHistory">历史</button>
  <button class="icon-btn" id="btnSettings">设置</button>
</header>

<nav class="tabs">
  <button class="tab active" data-view="note">速记</button>
  <button class="tab" data-view="chat">对话</button>
  <button class="tab" data-view="voice">语音</button>
</nav>

<main id="viewNote">
  <textarea id="input" placeholder="想到什么，直接写下…&#10;（长想法可以分段，写了就自动保存）" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="toolbar">
    <button id="btnVoice" title="语音输入" aria-label="语音输入">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="18" x2="12" y2="21.5"></line>
      </svg>
    </button>
    <div id="status">未设置仓库</div>
    <button id="btnSave">存 →</button>
  </div>
</main>

<main id="viewChat" hidden>
  <div class="chatlog" id="chatLog"></div>
  <div class="chatbar">
    <textarea id="chatInput" rows="1" placeholder="问点什么，或者把想法丢进来让我分析…"
      autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button id="btnSend">发送</button>
  </div>
</main>

<main id="viewVoice" hidden>
  <div class="voice-list" id="voiceList"></div>
  <div class="voice-bar">
    <button id="btnSysRec" class="rec-btn" hidden>
      <span class="rec-dot"></span>
      <span id="sysRecLabel">直接说话转文字</span>
    </button>
    <button id="btnRec" class="rec-btn" hidden>
      <span class="rec-dot"></span>
      <span id="recLabel">按住说话</span>
    </button>
    <button id="btnVoiceRefresh" class="icon-btn" style="height:52px">刷新</button>
  </div>
</main>

<!-- 设置 -->
<div class="sheet" id="sheetSettings" hidden>
  <div class="sheet-inner">
    <h2>设置<span class="spacer"></span>
      <button class="icon-btn" data-close>关闭</button>
    </h2>
    <label>DeepSeek 密钥（sk- 开头）</label>
    <input type="password" id="cfgAiKey" placeholder="sk-…" autocapitalize="off">
    <div class="hint">填完点下面的「保存」，切到「对话」就能用了。</div>

    <label style="margin-top:24px">GitHub 令牌（想同步存档再填）</label>
    <input type="password" id="cfgToken" placeholder="github_pat_… （可以留空）">
    <div class="hint">
      留空也能正常用，只是想法只存在这台手机上、不进仓库。<br>
      要同步就建 Fine-grained token，<b>只授权 ideas-data</b>，权限勾 Contents: Read and write。
    </div>

    <button class="btn" id="btnSaveCfg">保存</button>

    <details style="margin-top:16px">
      <summary style="font-size:13px;color:var(--muted);cursor:pointer;padding:6px 0">
        高级设置（已经填好，一般不用动）
      </summary>
      <label>GitHub 用户名</label>
      <input type="text" id="cfgOwner" autocapitalize="off">
      <label>数据仓库名</label>
      <input type="text" id="cfgRepo">
      <label>分支</label>
      <input type="text" id="cfgBranch">
      <label>文件夹</label>
      <input type="text" id="cfgPrefix">
      <label>AI 接口地址</label>
      <input type="text" id="cfgAiBase" autocapitalize="off">
      <label>模型</label>
      <input type="text" id="cfgAiModel" autocapitalize="off">
      <div class="hint">
        想让回答更爱深想，模型填 <b>deepseek-reasoner</b>（更慢更贵）。<br>
        余额查询：<b>platform.deepseek.com</b>
      </div>
    </details>
    <button class="btn ghost" data-close>取消</button>
    <button class="btn danger" id="btnClearCfg">清除本机设置</button>
    <button class="btn ghost" id="btnClearChat">清空对话记录</button>
  </div>
</div>

<!-- 历史 -->
<div class="sheet" id="sheetHistory" hidden>
  <div class="sheet-inner">
    <h2>历史<span class="spacer"></span>
      <button class="icon-btn" id="btnRefresh">刷新</button>
      <button class="icon-btn" data-close>关闭</button>
    </h2>
    <input type="text" id="search" placeholder="搜索想法…" style="margin-bottom:10px">
    <div id="historyList"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var input = $('#input'), statusEl = $('#status');

  // ---------- 本地存储 ----------
  function lsGet(k, d) {
    try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; }
  }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var cfg = lsGet('iv.cfg', null);      // {owner,repo,branch,prefix,token}
  var queue = lsGet('iv.queue', []);    // 待上传
  var log = lsGet('iv.log', []);        // 本机已记录（含未上传）
  var ai = lsGet('iv.ai', null);        // {base,key,model}
  var chats = lsGet('iv.chats', []);    // [{role,content}]

  var AI_DEFAULT_BASE = 'https://api.deepseek.com';
  var AI_DEFAULT_MODEL = 'deepseek-chat';

  // 这些都已经内置好了，用户只需要填「DeepSeek 密钥」和（可选）「GitHub 令牌」
  var DEFAULTS = {
    owner: 'buggood2318',
    repo: 'ideas-data',
    branch: 'main',
    prefix: 'ideas',
    aiBase: 'https://api.deepseek.com',
    aiModel: 'deepseek-chat'
  };
  var CHAT_MAX = 80;                    // 最多保留多少条消息，防止越存越大

  function saveQueue() { lsSet('iv.queue', queue); }
  function saveLog() { if (log.length > 800) log = log.slice(-800); lsSet('iv.log', log); }

  // 去重键：本机时间戳含毫秒，云端 markdown 只到分钟，所以统一按「分钟」比较
  function logKey(ts, text) {
    return Math.floor(ts / 60000) + '|' + String(text).trim();
  }
  function findLogEntry(ts, text) {
    var k = logKey(ts, text);
    for (var i = log.length - 1; i >= 0; i--) {
      if (logKey(log[i].ts, log[i].text) === k) return log[i];
    }
    return null;
  }

  // ---------- 工具 ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function b64encodeUtf8(str) {
    var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin);
  }
  function b64decodeUtf8(b64) {
    var bin = atob((b64 || '').replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  // ---------- GitHub API ----------
  function gh(path, opts) {
    opts = opts || {};
    var headers = {
      'Authorization': 'Bearer ' + cfg.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch('https://api.github.com' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body
    }).then(function (res) {
      return res.text().then(function (txt) {
        var data = null;
        try { data = JSON.parse(txt); } catch (e) {}
        if (!res.ok) {
          var err = new Error((data && data.message) || ('HTTP ' + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function mdPath(ts) {
    var d = new Date(ts);
    var prefix = (cfg.prefix || 'ideas').replace(/^\/+|\/+$/g, '');
    return prefix + '/' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '.md';
  }
  function fileHeader(ts) {
    var d = new Date(ts);
    return '# 想法速记 · ' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月\n\n';
  }
  function entryText(item) {
    var lines = item.text.split('\n');
    var s = '- **' + fmtTime(new Date(item.ts)) + '** ' + lines[0];
    for (var i = 1; i < lines.length; i++) s += '\n  ' + lines[i];
    return s + '\n';
  }

  // 追加一条到当月的 md 文件；冲突自动重试
  function appendEntry(item) {
    var path = mdPath(item.ts);
    var apiPath = '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' +
      path.split('/').map(encodeURIComponent).join('/');

    function attempt(n) {
      return gh(apiPath + '?ref=' + encodeURIComponent(cfg.branch))
        .then(function (r) {
          var text = b64decodeUtf8(r.content);
          return { sha: r.sha, text: text };
        }, function (e) {
          if (e.status === 404) return { sha: null, text: fileHeader(item.ts) };
          throw e;
        })
        .then(function (cur) {
          var body = {
            message: 'idea: ' + fmtTime(new Date(item.ts)) + ' ' +
              item.text.replace(/\s+/g, ' ').slice(0, 40),
            content: b64encodeUtf8(cur.text + entryText(item)),
            branch: cfg.branch
          };
          if (cur.sha) body.sha = cur.sha;
          return gh(apiPath, { method: 'PUT', body: JSON.stringify(body) });
        })
        .catch(function (e) {
          // 409/422 多为并发冲突：重新读一次再写
          if ((e.status === 409 || e.status === 422) && n < 3) {
            return sleep(400 * (n + 1)).then(function () { return attempt(n + 1); });
          }
          throw e;
        });
    }
    return attempt(0);
  }

  // ---------- 上传队列 ----------
  var syncing = false;
  function syncQueue() {
    if (!cfg || !cfg.token || !queue.length || syncing) return Promise.resolve();
    syncing = true;
    var done = 0;
    function step() {
      if (!queue.length) return Promise.resolve();
      var item = queue[0];
      return appendEntry(item).then(function () {
        queue.shift();
        saveQueue();
        // 传成功了就把本机那条标记成已同步（否则历史里会一直挂着「待上传」）
        var it = findLogEntry(item.ts, item.text);
        if (it && !it.synced) { it.synced = true; saveLog(); }
        done++;
        setStatus('上传中… ' + done);
        return step();
      });
    }
    return step().then(function () {
      syncing = false;
      return done;
    }, function (e) {
      syncing = false;
      setStatus('还有 ' + queue.length + ' 条没上去（' + (e.message || '网络错误') + '），会自动重试', 'warn');
      throw e;
    });
  }

  function renderStatus() {
    if (!cfg || !cfg.token) {
      var base = (ai && ai.key) ? '对话就绪' : '未设置';
      setStatus(queue.length
        ? (base + ' · ' + queue.length + ' 条没上传')
        : (base + ' · 未接仓库'), queue.length ? 'warn' : '');
      return;
    }
    if (queue.length) setStatus(queue.length + ' 条待上传', 'warn');
    else setStatus('已同步 · ' + cfg.owner + '/' + cfg.repo, 'ok');
  }

  // ---------- 保存 ----------
  function save() {
    var text = input.value.trim();
    if (!text) { input.focus(); return; }
    var item = { id: uid(), ts: Date.now(), text: text };
    queue.push(item);
    saveQueue();
    log.push({ ts: item.ts, text: item.text, synced: false });
    saveLog();

    input.value = '';
    if (navigator.vibrate) navigator.vibrate(12);
    input.focus();

    if (!cfg || !cfg.token) {
      setStatus('已存到这台手机（还没接仓库）', 'warn');
      return;
    }
    setStatus('上传中…');
    syncQueue().then(function () {
      // 已同步标记由 syncQueue 负责

  // 从云端拉当月 + 上月，合并到本机历史（按 时间+内容 去重）
  function pullFromCloud() {
    if (!cfg || !cfg.token) return;
    var now = new Date();
    var paths = [
      mdPath(now.getTime()),
      mdPath(new Date(now.getFullYear(), now.getMonth() - 1, 15).getTime())
    ];
    var chain = Promise.resolve();
    paths.forEach(function (p) {
      chain = chain.then(function () {
        var apiPath = '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' +
          p.split('/').map(encodeURIComponent).join('/');
        return gh(apiPath + '?ref=' + encodeURIComponent(cfg.branch))
          .then(function (r) { mergeParsed(b64decodeUtf8(r.content)); })
          .catch(function (e) { if (e.status !== 404) throw e; });
      });
    });
    chain.then(function () { renderHistoryIfOpen(); })
      .catch(function (e) { setStatus('拉取历史失败：' + (e.message || ''), 'warn'); });
  }

  function parseTime(s) {
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
  }

  function mergeParsed(md) {
    var lines = md.split('\n'), cur = null, idx = {};
    log.forEach(function (x) { idx[logKey(x.ts, x.text)] = x; });
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var m = line.match(/^- \*\*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\*\*\s?([\s\S]*)$/);
      if (m) {
        if (cur) pushIfNew(cur);
        var ts = parseTime(m[1]);
        cur = ts ? { ts: ts, text: m[2], synced: true } : null;
      } else if (cur && /^ {2}\S/.test(line)) {
        cur.text += '\n' + line.slice(2);
      } else if (cur && line.trim() === '') {
        pushIfNew(cur); cur = null;
      }
    }
    if (cur) pushIfNew(cur);
    saveLog();
    function pushIfNew(o) {
      var k = logKey(o.ts, o.text);
      var hit = idx[k];
      if (hit) {
        // 云端已经有了 → 本机那条可以放心标记为已同步
        if (hit.synced === false) hit.synced = true;
        return;
      }
      idx[k] = o;
      log.push(o);
    }
  }

  $('#chatLog').addEventListener('click', function (e) {

  // 把一段文字按「想法」的格式存进速记（复用上传队列）

  function buildMessages() {
    var sys = '你是小严手机上的随身助手。说话直接，先给结论再给理由；不要客套话，不要为了凑字数罗列。' +
      '回答用中文，排版朴素（必要时才用列表）。不确定的事要说清楚不确定，不要编。';
    var arr = [{ role: 'system', content: sys }];
    var hist = chats.slice(-20);
    for (var i = 0; i < hist.length; i++) {

  function sendChat() {
    if (sending) return;
    var text = $('#chatInput').value.trim();
    if (!text) return;
    if (!ai || !ai.key) {
      setStatus('先填 AI 密钥（点右上角设置）', 'err');
      openSheet('#sheetSettings');
      return;
    }

    $('#chatInput').value = '';
    chats.push({ role: 'user', content: text });
    saveChats();
    renderChat();

    var msgEl = document.createElement('div');
    msgEl.className = 'msg ai';
    msgEl.innerHTML = '<span class="cursor"></span>';
    $('#chatLog').appendChild(msgEl);
    $('#chatLog').scrollTop = $('#chatLog').scrollHeight;

    sending = true;
    $('#btnSend').disabled = true;
    var acc = '';

    function done(errMsg) {
      sending = false;
      $('#btnSend').disabled = false;
      if (errMsg) chats.push({ role: 'assistant', content: errMsg });
      else chats.push({ role: 'assistant', content: acc || '（没有返回内容）' });
      saveChats();
      renderChat();
    }

    function fail(e) {
      done('出错了：' + (e && e.message ? e.message : '网络异常'));
    }

    fetch(ai.base + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + ai.key
      },
      body: JSON.stringify({
        model: ai.model,
        stream: true,
        temperature: 0.7,
        messages: buildMessages()
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var msg = 'HTTP ' + res.status;
          try {
            var j = JSON.parse(t);
            if (j.error && j.error.message) msg += ' ' + j.error.message;
          } catch (e) {}
          if (res.status === 401) msg += '（密钥不对）';
          if (res.status === 402 || /insufficient|balance/i.test(msg)) msg += '（余额不足）';
          if (res.status === 429) msg += '（太快了，歇一下）';
          throw new Error(msg);
        });
      }
      // 不支持流式的兜底
      if (!res.body || !res.body.getReader) {
        return res.json().then(function (j) {
          acc = (j.choices && j.choices[0] && j.choices[0].message &&
            j.choices[0].message.content) || '';
          msgEl.textContent = acc;
        });
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var lines = buf.split('\n');
          buf = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf('data:') !== 0) continue;
            var payload = line.slice(5).trim();
            if (!payload || payload === '[DONE]') continue;
            try {
              var j = JSON.parse(payload);
              var d = j.choices && j.choices[0] && j.choices[0].delta;
              if (d && d.content) {
                acc += d.content;
                msgEl.textContent = acc;
                $('#chatLog').scrollTop = $('#chatLog').scrollHeight;
              }
            } catch (e) {}
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      done(null);
    }).catch(fail);
  }

  $('#btnSend').addEventListener('click', sendChat);
  $('#chatInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();

    }
  });
  $('#chatInput').addEventListener('input', function () {
    var el = $('#chatInput');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  });

  // ---------- 语音 ----------
  var mediaRec = null, recChunks = [], recTimer = null, recStream = null, recStarted = 0;
  var voicePending = lsGet('iv.voicePending', []);   // [{name,ts}] 已上传、还没转写
  var voiceItems = [];                               // 来自 voices/index.json
  var sysResult = null;                              // 系统语音识别的当场结果
  var sysRecOn = false;
  var CapSR = null;                                  // Capacitor 语音识别插件（仅 APK 里有）
  try {
    if (window.Capacitor && window.Capacitor.Plugins &&
        window.Capacitor.Plugins.SpeechRecognition) {
      CapSR = window.Capacitor.Plugins.SpeechRecognition;
    }
  } catch (e) { CapSR = null; }

  function stemOf(n) { return String(n).replace(/\.[^.]+$/, ''); }
  function fileStamp(d) {
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
      pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  function canRecord() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  function stopStream() {
    if (recStream) {
      try { recStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      recStream = null;
    }
  }

  function startRec() {
    if (!cfg || !cfg.token) {
      setStatus('先在设置里填 GitHub 令牌，录音才能上传', 'err');
      return;
    }
    if (mediaRec) return;
    if (!canRecord()) {
      setStatus('这个环境不支持录音，改从文件选', 'warn');
      pickAudio();
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recStream = stream;
      recChunks = [];
      var mime = '';
      ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].forEach(function (m) {
        if (!mime && window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) mime = m;
      });
      var opts = { audioBitsPerSecond: 32000 };
      if (mime) opts.mimeType = mime;
      mediaRec = new MediaRecorder(stream, opts);
      mediaRec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
      mediaRec.onstop = function () {
        stopStream();
        var type = (mediaRec && mediaRec.mimeType) || mime || 'audio/webm';
        var blob = new Blob(recChunks, { type: type });
        mediaRec = null;
        $('#btnRec').classList.remove('recording');
        $('#recLabel').textContent = '按住说话';
        if (blob.size < 1200) { setStatus('太短了，没录到声音', 'warn'); return; }
        uploadVoice(blob, type);
      };
      mediaRec.start();
      recStarted = Date.now();
      $('#btnRec').classList.add('recording');
      $('#recLabel').textContent = '松开结束';
      setStatus('在录… 松开结束', '');
      recTimer = setTimeout(stopRec, 120000);   // 最长 2 分钟
    }).catch(function (e) {
      setStatus('麦克风打不开（' + (e.message || e) + '），改从文件选', 'warn');
      pickAudio();
    });
  }

  function stopRec() {
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
    if (mediaRec && mediaRec.state !== 'inactive') {
      try { mediaRec.stop(); } catch (e) {}
    } else {
      stopStream();
      $('#btnRec').classList.remove('recording');
      $('#recLabel').textContent = '按住说话';
    }
  }

  function uploadVoice(blob, type) {
    var ext = String(type).indexOf('mp4') >= 0 ? 'm4a' : 'webm';
    uploadRaw(blob, fileStamp(new Date()) + '.' + ext);
  }

  function blobToB64(blob) {
    if (blob.arrayBuffer) {
      return blob.arrayBuffer().then(function (buf) {
        var bytes = new Uint8Array(buf), bin = '', CH = 0x8000;
        for (var i = 0; i < bytes.length; i += CH) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
        }
        return btoa(bin);
      });
    }
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  function uploadRaw(blobOrFile, name) {
    setStatus('上传中…', '');
    blobToB64(blobOrFile).then(function (b64) {
      putVoice(name, b64);
    }).catch(function () {
      setStatus('读文件失败', 'err');
    });
  }

  function putVoice(name, b64) {
    var path = '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/voices/' + encodeURIComponent(name);
    gh(path, {
      method: 'PUT',
      body: JSON.stringify({
        message: '语音 ' + name,
        content: b64,
        branch: cfg.branch
      })
    }).then(function () {
      voicePending.unshift({ name: stemOf(name), ts: Date.now() });
      lsSet('iv.voicePending', voicePending);
      setStatus('已上传 · 等电脑转写', 'ok');
      renderVoices();
    }).catch(function (e) {
      setStatus('上传失败：' + (e.message || '网络问题'), 'err');
    });
  }

  function pickAudio() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'audio/*';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      if (f.size > 8 * 1048576) { setStatus('文件太大（超过 8MB），传不上去', 'err'); return; }
      var ext = (f.name.split('.').pop() || 'm4a').toLowerCase().replace(/[^a-z0-9]/g, '');
      uploadRaw(f, fileStamp(new Date()) + '.' + (ext || 'm4a'));
    };
    inp.click();
  }

  function loadVoices() {
    if (!cfg || !cfg.token) { renderVoices(); return; }
    var path = '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/voices/index.json?ref=' +
      encodeURIComponent(cfg.branch);
    setStatus('拉取转写结果…', '');
    gh(path).then(function (r) {
      var data = {};
      try { data = JSON.parse(b64decodeUtf8(r.content)); } catch (e) {}
      voiceItems = (data && data.items) || [];
      var names = voiceItems.map(function (x) { return x.name; });
      var before = voicePending.length;
      voicePending = voicePending.filter(function (p) { return names.indexOf(p.name) < 0; });
      if (before !== voicePending.length) lsSet('iv.voicePending', voicePending);
      renderVoices();
      setStatus(voiceItems.length ? ('共 ' + voiceItems.length + ' 条转写') : '还没有转写结果', '');
    }).catch(function (e) {
      if (e.status === 404) { voiceItems = []; renderVoices(); setStatus('还没有转写结果', ''); }
      else setStatus('拉取失败：' + (e.message || ''), 'warn');
    });
  }

  function renderVoices() {
    var box = $('#voiceList');
    var html = '';
    if (sysResult) {
      html += '<div class="voice-item' + (sysResult.live ? ' pending' : '') + '">' +
        '<div class="vh">🎤 ' + (sysResult.live ? '正在听…（再点按钮结束）'
          : fmtTime(new Date(sysResult.ts))) + '</div>' +
        '<div class="vt">' + escapeHtml(sysResult.text || '（还没听到内容）') + '</div>' +
        (sysResult.live ? '' : '<div class="acts"><button data-syssave="1">存进速记</button></div>') +
        '</div>';
    }
    voicePending.forEach(function (p) {
      html += '<div class="voice-item pending"><div class="vh">⏳ ' + fmtTime(new Date(p.ts)) + '</div>' +
        '<div class="vt">等电脑转写中…（电脑开着就会自动处理）</div></div>';
    });
    for (var i = 0; i < voiceItems.length; i++) {
      var v = voiceItems[i];
      html += '<div class="voice-item"><div class="vh">🎙 ' + escapeHtml(v.transcribed_at || '') +
        (v.seconds ? ' · ' + v.seconds + ' 秒' : '') + '</div>' +
        '<div class="vt">' + escapeHtml(v.text || '') + '</div>' +
        '<div class="acts"><button data-vsave="' + i + '">存进速记</button></div></div>';
    }
    if (!html) html = '<div class="empty">还没有录音。<br>按住下面按钮说话，松开就上传。</div>';
    box.innerHTML = html;
  }

  $('#voiceList').addEventListener('click', function (e) {
    var t = e.target;
    var b = t.closest ? t.closest('[data-vsave]') : null;
    if (b) {
      var v = voiceItems[+b.getAttribute('data-vsave')];
      if (v && v.text) { storeIdea(v.text); b.textContent = '已存 ✓'; b.disabled = true; }
      return;
    }
    var c = t.closest ? t.closest('[data-syssave]') : null;
    if (c) {
      if (sysResult && sysResult.text) {
        storeIdea(sysResult.text);
        c.textContent = '已存 ✓';
        c.disabled = true;
      }
    }
  });

  // ----- 手机自带的语音识别（APK 里才有）-----
  function initVoice() {
    if (!CapSR || !CapSR.available) {
      $('#btnRec').hidden = false;
      return;
    }
    CapSR.available().then(function (r) {
      if (r && r.available) {
        $('#btnSysRec').hidden = false;
        $('#btnRec').hidden = false;
        $('#btnRec').classList.add('minor');
      } else {
        $('#btnRec').hidden = false;
      }
    }).catch(function () {
      $('#btnRec').hidden = false;
    });
  }

  function startSysRec() {
    setStatus('准备麦克风…', '');
    CapSR.requestPermissions().then(function (p) {
      var st = p && p.speechRecognition;
      if (st && st !== 'granted') {
        setStatus('没给语音识别权限，去手机设置里允许', 'err');
        return;
      }
      runSysRec();
    }).catch(function (e) {
      setStatus('启动失败：' + (e.message || e), 'err');
    });
  }

  function runSysRec() {
    sysRecOn = true;
    sysResult = { text: '', ts: Date.now(), live: true };
    $('#btnSysRec').classList.add('recording');
    $('#sysRecLabel').textContent = '说完点这里';
    setStatus('在听… 说完再点一下按钮', '');
    renderVoices();
    try { CapSR.removeAllListeners(); } catch (e) {}
    CapSR.addListener('partialResults', function (data) {
      var t = (data && data.matches && data.matches[0]) || '';
      if (t && sysResult) {
        sysResult.text = t;
        renderVoices();
      }
    });
    CapSR.addListener('listeningState', function (data) {
      if (data && data.status === 'stopped') finishSysRec();
    });
    CapSR.start({ language: 'zh-CN', partialResults: true, popup: false })
      .catch(function (e) {
        setStatus('识别失败：' + (e.message || e), 'err');
        finishSysRec();
      });
  }

  function stopSysRec() {
    if (!sysRecOn) return;
    try { if (CapSR && CapSR.stop) CapSR.stop(); } catch (e) {}
    setTimeout(finishSysRec, 500);   // 给插件吐最后一段的时间
  }

  function finishSysRec() {
    if (!sysRecOn) return;
    sysRecOn = false;
    $('#btnSysRec').classList.remove('recording');
    $('#sysRecLabel').textContent = '直接说话转文字';
    if (sysResult) {
      sysResult.live = false;
      if (!sysResult.text) {
        sysResult = null;
        setStatus('没识别到内容，再说一次试试', 'warn');
      } else {
        setStatus('识别好了，点「存进速记」保存', 'ok');
      }
    }
    renderVoices();
  }

  $('#btnSysRec').addEventListener('click', function () {
    if (sysRecOn) stopSysRec(); else startSysRec();
  });

  var btnRec = $('#btnRec');
  btnRec.addEventListener('pointerdown', function (e) { e.preventDefault(); startRec(); });
  btnRec.addEventListener('pointerup', function (e) { e.preventDefault(); stopRec(); });
  btnRec.addEventListener('pointercancel', function () { stopRec(); });
  btnRec.addEventListener('pointerleave', function () { if (mediaRec) stopRec(); });
  $('#btnVoiceRefresh').addEventListener('click', loadVoices);
  initVoice();

  // ---------- 启动 ----------
  renderStatus();
  renderVoices();
  if (cfg && cfg.token) syncQueue().then(renderStatus, function () {});
  window.addEventListener('online', function () {
    if (cfg && cfg.token) syncQueue().then(renderStatus, function () {});
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && cfg && cfg.token && queue.length) syncQueue().then(renderStatus, function () {});
  });
  // 自动聚焦（手机上可能不弹键盘，无害）
  setTimeout(function () { try { input.focus(); } catch (e) {} }, 300);

  // service worker（离线打开）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
